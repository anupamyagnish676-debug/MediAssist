version: '3.8'

services:
  app:
    build: .
    container_name: med_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/meddb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-medadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password123}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - db
    volumes:
      - app_uploads:/app/uploads

  db:
    image: pgvector/pgvector:pg16
    container_name: med_db
    restart: always
    environment:
      POSTGRES_DB: meddb
      POSTGRES_USER: ${DB_USER:-medadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  app_uploads:
