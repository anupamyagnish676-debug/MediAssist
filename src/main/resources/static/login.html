<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | MediAssist Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            padding: 1rem;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--gray-200);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary);
        }
        .login-header p {
            color: var(--gray-600);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
        }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: bold;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            background: var(--primary-hover);
        }
        .demo-box {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
        }
        .demo-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--gray-400);
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            text-align: center;
        }
        .btn-demo {
            width: 100%;
            text-align: left;
            padding: 0.65rem 0.85rem;
            font-size: 0.85rem;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-demo:hover {
            background: #e0f2fe;
            border-color: #38bdf8;
            color: #0369a1;
        }
        .error-msg {
            color: var(--danger);
            background: var(--danger-light);
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">🩺</div>
            <h2>MediAssist Health Portal</h2>
            <p>Role-Based Authentication Access</p>
        </div>

        <div class="error-msg" id="error-box"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@hospital.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-login" id="login-btn">Sign In</button>
        </form>

        <div class="demo-box">
            <div class="demo-title">⚡ One-Click Demo Logins</div>
            
            <button type="button" class="btn-demo" onclick="fillAndLogin('admin@mediassist.com', 'Admin@123')">
                <span>👑 <strong>Company Super Admin</strong></span>
                <span style="font-size:0.75rem; color:#64748b;">All Hospitals Scope</span>
            </button>

            <button type="button" class="btn-demo" onclick="fillAndLogin('manager@citycare.com', 'Manager@123')">
                <span>🏥 <strong>City Care Hospital Manager</strong></span>
                <span style="font-size:0.75rem; color:#64748b;">Hospital 1 Scope</span>
            </button>

            <button type="button" class="btn-demo" onclick="fillAndLogin('manager@apollo.com', 'Manager@123')">
                <span>🏥 <strong>Apollo Clinic Manager</strong></span>
                <span style="font-size:0.75rem; color:#64748b;">Hospital 2 Scope</span>
            </button>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            if (e) e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errBox = document.getElementById('error-box');

            btn.disabled = true;
            btn.innerText = "Signing in...";
            errBox.style.display = "none";

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    sessionStorage.setItem('med_user', JSON.stringify(data));
                    if (data.role === 'SUPER_ADMIN') {
                        window.location.href = '/admin-portal.html';
                    } else if (data.role === 'HOSPITAL_MANAGER') {
                        window.location.href = '/manager-portal.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                } else {
                    errBox.innerText = data.message || "Invalid credentials.";
                    errBox.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "Sign In";
                }
            } catch (err) {
                errBox.innerText = "Could not connect to authentication server.";
                errBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        }

        function fillAndLogin(userEmail, userPass) {
            document.getElementById('email').value = userEmail;
            document.getElementById('password').value = userPass;
            handleLogin();
        }
    </script>
</body>
</html>
