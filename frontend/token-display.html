<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Room Queue Display | MedAssist</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="tv-screen">

    <div class="tv-header">
        <div>
            <h1 style="font-size: 2.2rem; color: #ffffff;">🏥 City Care Multispeciality Hospital</h1>
            <p style="color: #94a3b8; font-size: 1.1rem;">Outpatient Department (OPD) Live Token Calling System</p>
        </div>
        <div class="tv-clock" id="clock">12:00:00 PM</div>
    </div>

    <div class="tv-main">
        <!-- Center Box: Currently Serving -->
        <div class="tv-serving-box">
            <div class="tv-token-title">NOW SERVING TOKEN</div>
            <div class="tv-token-huge" id="serving-token">#--</div>
            <div class="tv-doc-details" id="serving-doctor">Waiting for next patient check-in</div>
            <div>
                <span class="tv-room-badge" id="serving-room">Room --</span>
            </div>
        </div>

        <!-- Right Box: Upcoming Queue -->
        <div class="tv-upcoming-box">
            <div class="tv-upcoming-title">NEXT IN QUEUE</div>
            <div id="queue-list">
                <div style="text-align: center; color: #64748b; margin-top: 3rem;">
                    No patients currently waiting in queue.
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function refreshQueue() {
            try {
                const data = await App.getLiveQueue(1);

                if (data.currentServingToken) {
                    document.getElementById('serving-token').innerText = '#' + String(data.currentServingToken).padStart(2, '0');
                    document.getElementById('serving-doctor').innerText = data.currentServingDoctor;
                    document.getElementById('serving-room').innerText = 'Room ' + data.currentServingRoom;
                } else {
                    document.getElementById('serving-token').innerText = '#--';
                    document.getElementById('serving-doctor').innerText = 'Waiting for check-in';
                    document.getElementById('serving-room').innerText = 'Room --';
                }

                const listEl = document.getElementById('queue-list');
                if (data.waitingQueue && data.waitingQueue.length > 0) {
                    listEl.innerHTML = data.waitingQueue.map(q => `
                        <div class="tv-queue-item">
                            <div>
                                <strong style="font-size: 1.3rem; color: #38bdf8;">#${String(q.token).padStart(2, '0')}</strong>
                                <div style="font-size: 0.9rem; color: #94a3b8;">${q.doctor}</div>
                                ${q.timeSlot ? `<div style="font-size: 0.8rem; color: #38bdf8; margin-top: 2px;">🕒 Slot: ${q.timeSlot}</div>` : ''}
                            </div>
                            <span style="font-size: 0.95rem; color: #cbd5e1; background: #334155; padding: 4px 10px; border-radius: 6px;">
                                Room ${q.room}
                            </span>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = `<div style="text-align: center; color: #64748b; margin-top: 3rem;">No patients waiting.</div>`;
                }

            } catch (err) {
                console.error("Queue refresh error:", err);
            }
        }

        setInterval(refreshQueue, 3000);
        refreshQueue();
    </script>
</body>
</html>
